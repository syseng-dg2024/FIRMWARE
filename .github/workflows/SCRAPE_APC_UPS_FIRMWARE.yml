name: Scrape APC Firmware Table

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Scrape and parse APC firmware
        run: python .github/scripts/SCRAPE_APC_UPS_FIRMWARE.py
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull origin main
          git add APC/UPS/UPS_Firmware_Lookup.json
          git commit -m "Update APC UPS firmware versions" || echo "No changes"
          git push origin main
