name: Parse Firmware Data

on:
  push:
    paths:
      - './github/data/raw/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Parse all firmware data
        run: python .github/scripts/PARSE_FIRMWARE.py
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/output/
          git commit -m "Update firmware lookup tables" || echo "No changes"
          git push
