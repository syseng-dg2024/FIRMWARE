name: Scrape HPE SPP Firmware

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Scrape HPE SPP firmware
        run: python .github/scripts/SCRAPE_HPE_SPP_FIRMWARE.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add HPE/SPP/SPP_Firmware_Lookup.json
          git commit -m "Update HPE SPP Firmware Lookup" || true
          git pull origin main --rebase
          git push origin main
